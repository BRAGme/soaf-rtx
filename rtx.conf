# =====================================================
# RTX Remix - The Sum of All Fears
# rtx.conf - Full Configuration
# Includes: Original settings + Culling fixes + Anti-culling + Render range
# =====================================================

# --- Hash Stability ---
rtx.useObsoleteHashOnTextureUpload = False
rtx.geometryAssetHashRuleString = positions,indices,geometrydescriptor
rtx.geometryGenerationHashRuleString = positions,indices,texcoords,geometrydescriptor,vertexlayout,vertexshader

# --- Backface Culling ---
# Disable to make all opaque geometry double-sided (fixes hollow walls/floors/characters)
rtx.enableCulling = False
rtx.enableCullingInSecondaryRays = False

# --- Object Anti-Culling (more map rendered around player) ---
rtx.antiCulling.object.enable = True
rtx.antiCulling.object.enableHighPrecisionAntiCulling = True
rtx.antiCulling.object.enableInfinityFarFrustum = True
rtx.antiCulling.object.fovScale = 2.0
rtx.antiCulling.object.numObjectsToKeep = 50000
rtx.antiCulling.object.hashInstanceWithBoundingBoxHash = False

# --- Light Anti-Culling ---
rtx.antiCulling.light.enable = True
rtx.antiCulling.light.numFramesToExtendLightLifetime = 2000
rtx.antiCulling.light.fovScale = 2.0

# --- Scene Size / BVH (more geometry in ray tracing scene) ---
rtx.maxPrimsInMergedBLAS = 200000
rtx.minPrimsInDynamicBLAS = 500
rtx.enableAlwaysCalculateAABB = True

